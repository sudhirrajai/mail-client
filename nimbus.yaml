version: 1

# Required runtimes
runtime:
  php: 8.3
  node: 20

# Commands to run during the installation phase
# Next.js dependencies in root, Laravel dependencies in backend/
install:
  - npm install
  - composer install --working-dir=backend --no-dev --optimize-autoloader

# Commands to run during the build phase
build:
  - npm run build
  - cp -n backend/.env.example backend/.env
  - php backend/artisan key:generate --force
  - sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' backend/.env
  - sed -i 's/.*DB_HOST=.*/DB_HOST=127.0.0.1/' backend/.env
  - sed -i 's/.*DB_PORT=.*/DB_PORT=3306/' backend/.env
  - sed -i 's/.*DB_DATABASE=.*/DB_DATABASE=webmail/' backend/.env
  - sed -i 's/.*DB_USERNAME=.*/DB_USERNAME=webmail_user/' backend/.env
  - sed -i 's/.*DB_PASSWORD=.*/DB_PASSWORD=09D6gnu540BA/' backend/.env
  - php backend/artisan migrate --force
  - php backend/artisan config:cache
  - php backend/artisan route:cache

# Environment variables to be set/updated
env:
  APP_ENV: production
  APP_DEBUG: "false"

# Nginx configuration overrides
# Point Nginx root to Laravel's public directory
nginx:
  root: backend/public
  php_version: 8.3

# Supervisor process configuration for Next.js app
# Uses dedicated PORT 3002 to avoid conflicts with other Node/Next apps on port 3000
supervisor:
  program: nextjs_webmail
  config: |
    [program:nextjs_webmail]
    process_name=%(program_name)s_%(process_num)02d
    command=npm run start -- -p 3002
    directory={domainPath}
    autostart=true
    autorestart=true
    user=www-data
    numprocs=1
    environment=PORT="3002"
    redirect_stderr=true
    stdout_logfile={domainPath}/backend/storage/logs/nextjs.log
    stopwaitsecs=3600
