version: 1

# Required runtimes
runtime:
  php: 8.3
  node: 20

# Commands to run during the installation phase
install:
  - npm install
  - cd backend
  - composer install --no-dev --optimize-autoloader
  - cd ..

# Commands to run during the build phase
build:
  - npm run build
  - cd backend
  - cp -n .env.example .env
  - php artisan key:generate --force
  - sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
  - sed -i 's/.*DB_HOST=.*/DB_HOST=127.0.0.1/' .env
  - sed -i 's/.*DB_PORT=.*/DB_PORT=3306/' .env
  - sed -i 's/.*DB_DATABASE=.*/DB_DATABASE=webmail/' .env
  - sed -i 's/.*DB_USERNAME=.*/DB_USERNAME=webmail_user/' .env
  - sed -i 's/.*DB_PASSWORD=.*/DB_PASSWORD=09D6gnu540BA/' .env
  - php artisan migrate --force
  - php artisan config:cache
  - php artisan route:cache
  - cd ..

# Environment variables to be set/updated
env:
  APP_ENV: production
  APP_DEBUG: "false"

# Nginx configuration overrides
nginx:
  root: backend/public
  php_version: 8.3

# Supervisor process configuration for Next.js app
supervisor:
  program: nextjs_webmail
  config: |
    [program:nextjs_webmail]
    command=npm run start
    directory={domainPath}
    autostart=true
    autorestart=true
    user=www-data
    numprocs=1
    redirect_stderr=true
    stdout_logfile={domainPath}/backend/storage/logs/nextjs.log
